<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastos Familia 🏠</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0d0f14;
      --surface:  #161922;
      --border:   #252a35;
      --accent:   #7fffb2;
      --warn:     #ffcc44;
      --danger:   #ff5c5c;
      --text:     #e8eaf0;
      --muted:    #6b7280;
      --radius:   16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent); }

    .month-selector {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .month-selector button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      transition: all 0.2s;
    }

    .month-selector button:hover { border-color: var(--accent); color: var(--accent); }
    .month-selector #mes-label { font-size: 1rem; font-weight: 700; min-width: 140px; text-align: center; }

    /* ── KPI CARDS ── */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      position: relative;
      overflow: hidden;
    }

    .kpi::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-color, var(--accent));
    }

    .kpi label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .kpi .value {
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
      color: var(--accent-color, var(--accent));
    }

    .kpi .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      font-family: 'DM Mono', monospace;
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── BARRAS DE CATEGORÍAS ── */
    .cat-list { display: flex; flex-direction: column; gap: 14px; }

    .cat-item {}

    .cat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .cat-name { font-size: 0.875rem; font-weight: 600; }
    .cat-amounts { font-size: 0.75rem; font-family: 'DM Mono', monospace; color: var(--muted); }

    .bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── CHART ── */
    .chart-wrap { position: relative; height: 260px; }

    /* ── LOADING / EMPTY ── */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 32px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<header>
  <h1>Gastos <span>Familia</span> 🏠</h1>
  <div class="month-selector">
    <button onclick="cambiarMes(-1)">◀</button>
    <span id="mes-label">—</span>
    <button onclick="cambiarMes(1)">▶</button>
  </div>
</header>

<!-- KPIs -->
<div class="kpis" id="kpis">
  <div class="loading"><div class="spinner"></div>Cargando...</div>
</div>

<!-- Gráficas -->
<div class="grid">
  <div class="card">
    <h2>📊 Categorías vs Presupuesto</h2>
    <div class="cat-list" id="cat-list">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </div>
  <div class="card">
    <h2>📈 Gastos por mes</h2>
    <div class="chart-wrap">
      <canvas id="chart-meses"></canvas>
    </div>
  </div>
</div>

<footer>Actualizado en tiempo real desde Supabase · Gastos Familia 2026</footer>

<script>
// ── CONFIGURACIÓN ──────────────────────────────────────────────────────────
const SUPABASE_URL = "https://rciwveeaxydullpcwvmu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjaXd2ZWVheHlkdWxscGN3dm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNTQzMDksImV4cCI6MjA4ODgzMDMwOX0.666zyqQ-Ps9j9DHVT1fuL58O-dfBAgJLWGcp6DGeAsA";

const CATS = {
  vivienda:       { emoji: "🏠", label: "Vivienda",        budget: 2693000 },
  mercado:        { emoji: "🛒", label: "Mercado/Aseo",    budget: 1900000 },
  familia:        { emoji: "👨‍👩‍👧", label: "Familia",         budget: 2071000 },
  transporte:     { emoji: "⛽", label: "Transporte",      budget: 450000  },
  servicios:      { emoji: "💡", label: "Servicios",       budget: 395000  },
  celulares:      { emoji: "📱", label: "Celulares",       budget: 80000   },
  ocio:           { emoji: "🎮", label: "Ocio",            budget: 500000  },
  personalJ:      { emoji: "👤", label: "Personal Andres", budget: 400000  },
  personalD:      { emoji: "👤", label: "Personal Dani",   budget: 400000  },
  deudas:         { emoji: "💳", label: "Deudas",          budget: 470000  },
  fondoCarro:     { emoji: "🚗", label: "Fondo Carro",     budget: 500000  },
  fondoImpuestos: { emoji: "🏛️", label: "Fondo Impuestos", budget: 500000  },
  otros:          { emoji: "📦", label: "Otros",           budget: 0       },
};

const INGRESOS = 13848000;
const MESES    = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// ── ESTADO ─────────────────────────────────────────────────────────────────
const hoy    = new Date();
let anio     = hoy.getFullYear();
let mes      = hoy.getMonth() + 1;
let chartMes = null;

const fmt = (n) => new Intl.NumberFormat("es-CO", {
  style: "currency", currency: "COP", minimumFractionDigits: 0
}).format(n);

// ── SUPABASE FETCH ──────────────────────────────────────────────────────────
async function fetchGastos(desde, hasta) {
  const url = `${SUPABASE_URL}/rest/v1/gastos?fecha=gte.${desde}&fecha=lte.${hasta}&select=monto,categoria,fecha,quien`;
  const res = await fetch(url, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`
    }
  });
  return res.json();
}

// ── RENDER MES ACTUAL ───────────────────────────────────────────────────────
async function renderMes() {
  const mesStr   = String(mes).padStart(2, "0");
  const desde    = `${anio}-${mesStr}-01`;
  const hasta    = `${anio}-${mesStr}-31`;
  const mesNombre = `${MESES[mes - 1]} ${anio}`;

  document.getElementById("mes-label").textContent = mesNombre;

  const data = await fetchGastos(desde, hasta);

  // Agrupar por categoría
  const totales = {};
  (data || []).forEach(g => {
    totales[g.categoria] = (totales[g.categoria] || 0) + g.monto;
  });

  const totalGastado  = Object.values(totales).reduce((s, v) => s + v, 0);
  const totalBudget   = Object.values(CATS).reduce((s, c) => s + c.budget, 0);
  const ahorro        = INGRESOS - totalGastado;
  const pctGastado    = Math.round((totalGastado / INGRESOS) * 100);

  // KPIs
  document.getElementById("kpis").innerHTML = `
    <div class="kpi" style="--accent-color: var(--accent)">
      <label>💰 Ingresos</label>
      <div class="value">${fmt(INGRESOS)}</div>
      <div class="sub">Mes ${mesNombre}</div>
    </div>
    <div class="kpi" style="--accent-color: ${pctGastado > 90 ? 'var(--danger)' : pctGastado > 70 ? 'var(--warn)' : 'var(--accent)'}">
      <label>💸 Gastado</label>
      <div class="value">${fmt(totalGastado)}</div>
      <div class="sub">${pctGastado}% del ingreso</div>
    </div>
    <div class="kpi" style="--accent-color: ${ahorro < 0 ? 'var(--danger)' : 'var(--accent)'}">
      <label>${ahorro >= 0 ? '💚 Ahorro' : '🔴 Déficit'}</label>
      <div class="value">${fmt(Math.abs(ahorro))}</div>
      <div class="sub">${ahorro >= 0 ? 'Disponible' : 'Te pasaste'}</div>
    </div>
    <div class="kpi" style="--accent-color: var(--warn)">
      <label>🎯 Presupuesto total</label>
      <div class="value">${fmt(totalBudget)}</div>
      <div class="sub">Gastos fijos planificados</div>
    </div>
  `;

  // Barras de categorías
  const catHTML = Object.entries(CATS)
    .filter(([id, cat]) => (totales[id] || 0) > 0 || cat.budget > 0)
    .sort((a, b) => {
      const pctA = a[1].budget > 0 ? (totales[a[0]] || 0) / a[1].budget : 0;
      const pctB = b[1].budget > 0 ? (totales[b[0]] || 0) / b[1].budget : 0;
      return pctB - pctA;
    })
    .map(([id, cat]) => {
      const gastado = totales[id] || 0;
      const pct     = cat.budget > 0 ? Math.min((gastado / cat.budget) * 100, 100) : 0;
      const color   = pct > 100 ? 'var(--danger)' : pct > 80 ? 'var(--warn)' : 'var(--accent)';
      const restante = cat.budget - gastado;
      return `
        <div class="cat-item">
          <div class="cat-header">
            <span class="cat-name">${cat.emoji} ${cat.label}</span>
            <span class="cat-amounts">${fmt(gastado)} ${cat.budget > 0 ? '/ ' + fmt(cat.budget) : ''}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%; background:${color}"></div>
          </div>
        </div>`;
    }).join("");

  document.getElementById("cat-list").innerHTML = catHTML || '<div class="loading">Sin gastos este mes</div>';
}

// ── GRÁFICA HISTÓRICA (últimos 6 meses) ────────────────────────────────────
async function renderChartMeses() {
  const labels  = [];
  const valores = [];

  for (let i = 5; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const a = d.getFullYear();
    const desde = `${a}-${m}-01`;
    const hasta = `${a}-${m}-31`;
    const data  = await fetchGastos(desde, hasta);
    const total = (data || []).reduce((s, g) => s + g.monto, 0);
    labels.push(MESES[d.getMonth()].slice(0, 3));
    valores.push(total);
  }

  if (chartMes) chartMes.destroy();

  chartMes = new Chart(document.getElementById("chart-meses"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Gastos",
        data: valores,
        backgroundColor: valores.map((v, i) =>
          i === 5 ? "rgba(127,255,178,0.9)" : "rgba(127,255,178,0.3)"
        ),
        borderRadius: 8,
        borderSkipped: false,
      }, {
        label: "Ingresos",
        data: Array(6).fill(INGRESOS),
        type: "line",
        borderColor: "rgba(255,204,68,0.6)",
        borderWidth: 2,
        borderDash: [6, 4],
        pointRadius: 0,
        fill: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => fmt(ctx.raw)
          }
        }
      },
      scales: {
        x: {
          grid: { color: "rgba(255,255,255,0.05)" },
          ticks: { color: "#6b7280", font: { family: "DM Mono" } }
        },
        y: {
          grid: { color: "rgba(255,255,255,0.05)" },
          ticks: {
            color: "#6b7280",
            font: { family: "DM Mono" },
            callback: (v) => "$" + (v / 1000000).toFixed(1) + "M"
          }
        }
      }
    }
  });
}

// ── NAVEGACIÓN MES ──────────────────────────────────────────────────────────
function cambiarMes(delta) {
  mes += delta;
  if (mes > 12) { mes = 1;  anio++; }
  if (mes < 1)  { mes = 12; anio--; }
  renderMes();
}

// ── INICIAR ─────────────────────────────────────────────────────────────────
renderMes();
renderChartMeses();
</script>
</body>
</html>
